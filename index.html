<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Runner Adventure</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--a:#ffcc33;--b:#ff5d73;--d:#1d2b53}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2b53;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud>div{flex:1;font-size:clamp(16px,3.4vw,24px)}
#sc{text-align:left}#ds{text-align:center;opacity:.9}#rt{display:flex;justify-content:flex-end;align-items:center;gap:8px;pointer-events:auto}
#sc small{display:block;font-size:.55em;opacity:.8;letter-spacing:1px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer}
#jb{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ff9a8b,var(--b));color:#fff;font:900 20px system-ui;box-shadow:0 8px 0 #b32a42,0 12px 24px rgba(0,0,0,.4);opacity:.88}
#jb:active{transform:translateY(5px);box-shadow:0 3px 0 #b32a42}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(76,201,240,.92),rgba(29,43,83,.96));animation:in .35s ease;overflow:auto}
@keyframes in{from{opacity:0;transform:scale(.96)}}
h1{margin:0;font-size:clamp(34px,9vw,68px);line-height:.95;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 var(--b),0 8px 0 rgba(0,0,0,.25)}
h1 span{color:var(--a)}h2{margin:0;font-size:clamp(30px,7vw,52px);text-shadow:0 4px 0 var(--b)}
#cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cd{width:min(29vw,150px);padding:10px 6px;border-radius:18px;background:rgba(255,255,255,.14);border:3px solid transparent;cursor:pointer;transition:.15s}
.cd.on{border-color:var(--a);background:rgba(255,255,255,.28);transform:translateY(-4px) scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.cd canvas{display:block;margin:0 auto 4px;width:min(20vw,92px);height:auto}
.cd b{display:block;font-size:14px}.cd i{font-style:normal;font-size:11px;opacity:.85}
button.big{font:900 clamp(20px,5vw,28px) system-ui;padding:14px 38px;border-radius:40px;border:0;color:#3a2600;background:linear-gradient(#ffe066,var(--a));box-shadow:0 6px 0 #c48a00,0 10px 20px rgba(0,0,0,.3);cursor:pointer;animation:pl 1.4s infinite}
button.big:active{transform:translateY(4px)}
button.sm{font:700 15px system-ui;padding:9px 22px;border-radius:30px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
@keyframes pl{50%{transform:scale(1.05)}}
.hint{margin:0;font-size:13px;opacity:.8}.pt{display:none;color:var(--a)}
@media(orientation:portrait) and (max-width:700px){.pt{display:block}}
#nh{color:var(--a);font:900 26px system-ui;animation:pl .6s infinite}
.big2{font-size:22px}.big2 b{font-size:1.5em;color:var(--a)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" hidden><div id="sc"><small>SCORE</small><span id="sv">0</span></div><div id="ds">0 m</div><div id="rt"><span id="cn">🪙 0</span><button class="ib" id="mu">🔊</button><button class="ib" id="pb">⏸</button></div></div>
<button id="jb" hidden>JUMP</button>

 for(const o of obs){o.x-=sp+(o.t==='enemy'?1.3*dt:0);
  const L=p.x+12,Rr=p.x+44,T=p.y-66;
  if(Rr>o.x&&L<o.x+o.w&&p.y<=G-o.h){o.m=Math.min(o.m,G-o.h-p.y)}
  if(!o.d&&o.x+o.w<p.x){o.d=true;if(o.m<14&&o.m>=0){bonus+=25;toast('NEAR MISS +25','#7CFFB2')}}
  if(!o.dead&&inv<=0&&Rr-2>o.x+3&&L+2<o.x+o.w-3&&p.y>G-o.h+4&&T<G){
   if(boost>0){o.dead=1;bonus+=20;burst(o.x+o.w/2,G-o.h/2,14,'#ff9a3c',9);SFX.coin()}
   else if(shield>0){shield=0;inv=60;o.dead=1;burst(p.x+28,p.y-30,16,'#4cc9f0',9);SFX.hit();toast('SHIELD BROKE','#4cc9f0')}
   else if(lives>0){lives--;inv=90;shk=14;o.dead=1;burst(p.x+28,p.y-30,18,'#ff5d73',9);SFX.hit();toast('LIFE USED ❤️','#ff5d73')}
   else return die()}}
 obs=obs.filter(o=>o.x>-100&&!o.dead);
 for(const c of coins){c.x-=sp;const dx=p.x+28-c.x,dy=p.y-55-c.y,d=Math.hypot(dx,dy);
  if(magnet>0&&d<170&&d>1){c.x+=dx/d*9*dt;c.y+=dy/d*9*dt}
  if(d<46){c.g=1;cn++;combo=comboT>0?Math.min(combo+1,5):1;comboT=90;bonus+=10*combo;SFX.coin();burst(c.x,c.y,4,'#ffe066',4);if(combo>1)toast('COMBO x'+combo,'#ffe066')}}
 coins=coins.filter(c=>c.x>-30&&!c.g);
 for(const u of pus){u.x-=sp;if(Math.hypot(p.x+28-u.x,p.y-55-u.y)<50){u.g=1;SFX.pw();bonus+=50;burst(u.x,u.y,12,'#fff',7);
  if(u.t==='S'){shield=1;toast('🛡 SHIELD','#4cc9f0')}else if(u.t==='M'){magnet=600;toast('🧲 MAGNET','#ff7ad9')}else if(u.t==='B'){boost=300;toast('⚡ SPEED BOOST','#ffe066')}else{lives=Math.min(3,lives+1);toast('❤️ EXTRA LIFE','#ff5d73')}}}
 pus=pus.filter(u=>u.x>-40&&!u.g);
 if(Math.floor(m/500)>ms){ms++;bonus+=100;toast('🏁 '+ms*500+' m! +100','#7CFFB2')}
 magnet-=dt;boost-=dt;inv-=dt;comboT-=dt;if(comboT<=0)combo=0;shk*=.9;
 for(const q of pts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.25*dt;q.l-=dt}pts=pts.filter(q=>q.l>0);
 for(const t of tos)t.l-=dt;tos=tos.filter(t=>t.l>0);
 if(boost>0&&R()<.6)pts.push({x:p.x,y:p.y-R()*50,vx:-3,vy:0,l:14,c:'#ffd93d'})}
function die(){SFX.hit();SFX.over();shk=22;burst(p.x+28,p.y-34,30,'#ff5d73',11);st='over';p.dd=0;const s=score();
 if(s>best){best=s;isNew=true;try{localStorage.setItem('rbest',best)}catch(e){}}
 setTimeout(()=>{if(st!=='over')return;$('fs').textContent=s;$('fb').textContent=best;$('fc').textContent=cn;$('fm').textContent=Math.floor(dist/10);$('nh').hidden=!isNew;
  $('dg').textContent=s>=goal?'🎯 Daily goal complete!':'🎯 Daily goal: '+goal+' ('+(goal-s)+' to go)';$('ov').hidden=false;$('jb').hidden=true;$('hud').hidden=true},900)}
/* drawing */
function hills(o,a,b,c){x.fillStyle=c;x.beginPath();x.moveTo(0,G);for(let i=0;i<=W+20;i+=20)x.lineTo(i,b-a*(Math.sin((i+o)*.008)+.5*Math.sin((i+o)*.021)+1));x.lineTo(W+20,G);x.fill()}
function draw(t){x.setTransform(S*dpr,0,0,S*dpr,0,0);if(shk>.5)x.translate((R()-.5)*shk,(R()-.5)*shk);
 const g=x.createLinearGradient(0,0,0,G);g.addColorStop(0,'#3aa6ff');g.addColorStop(1,'#ffd9a0');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);
 x.fillStyle='#fff6c2';x.beginPath();x.arc(W*.8,G*.28,34,0,7);x.fill();
 const d=st==='play'||st==='pause'||st==='over'?dist:t/20;
 x.fillStyle='rgba(255,255,255,.85)';for(const c of cl){if(st==='play')c.x-=.25*c.s;if(c.x<-100)c.x=W+60;const r=c.s*22;x.beginPath();x.arc(c.x,c.y,r,0,7);x.arc(c.x+r,c.y+3,r*.8,0,7);x.arc(c.x-r,c.y+5,r*.7,0,7);x.fill()}
 hills(d*.08,60,G-30,'#7fc8a9');hills(d*.2+300,40,G-4,'#4fa66a');
 x.fillStyle='#8a5a2b';x.fillRect(-20,G,W+40,H);x.fillStyle='#5fb04a';x.fillRect(-20,G,W+40,10);x.fillStyle='#3f8a35';x.fillRect(-20,G+10,W+40,4);
 x.fillStyle='rgba(0,0,0,.12)';for(let i=-1;i<W/60+2;i++){const a=i*60-(d%60);x.fillRect(a,G+26,26,6);x.fillRect(a+30,G+48,18,6)}
 if(st==='menu'){x.setTransform(S*dpr,0,0,S*dpr,0,0);return}
 for(const o of obs)drawObs(o,t);
 for(const c of coins){const w=Math.abs(Math.cos(t/180+c.a))*9+2;x.fillStyle='#ffc400';x.beginPath();x.ellipse(c.x,c.y,w,10,0,0,7);x.fill();x.fillStyle='#fff3a0';x.fillRect(c.x-1,c.y-5,2,10)}
 for(const u of pus){const yy=u.y+Math.sin(t/200)*4;x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(u.x,yy,20,0,7);x.fill();x.font='24px serif';x.textAlign='center';x.fillText({S:'🛡',M:'🧲',B:'⚡',L:'❤️'}[u.t],u.x,yy+9)}
 drawP(t);
 for(const q of pts){x.globalAlpha=Math.min(1,q.l/15);x.fillStyle=q.c;x.fillRect(q.x,q.y,5,5)}x.globalAlpha=1;
 x.textAlign='center';x.font='900 22px system-ui';x.lineWidth=4;
 tos.forEach((o,i)=>{x.globalAlpha=Math.min(1,o.l/20);x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle=o.c;const yy=H*.28+i*0+(70-o.l)*-.4-i*26;x.strokeText(o.t,W/2,yy);x.fillText(o.t,W/2,yy)});x.globalAlpha=1;
 x.textAlign='left';x.font='18px serif';let s='';if(lives)s+='❤️'.repeat(lives)+' ';if(shield)s+='🛡 ';if(magnet>0)s+='🧲 ';if(boost>0)s+='⚡';x.fillText(s,14,H*.1+34)}
function drawObs(o,t){const b=G,{x:a,w,h}=o;
 if(o.t==='rock'){x.fillStyle='#8d99ae';x.beginPath();x.moveTo(a,b);x.lineTo(a+w*.15,b-h*.7);x.lineTo(a+w*.5,b-h);x.lineTo(a+w*.9,b-h*.6);x.lineTo(a+w,b);x.fill();x.fillStyle='#b8c0cf';x.fillRect(a+w*.3,b-h*.8,w*.2,5)}
 else if(o.t==='box'){x.fillStyle='#c98a3d';x.fillRect(a,b-h,w,h);x.strokeStyle='#7a4c14';x.lineWidth=4;x.strokeRect(a+2,b-h+2,w-4,h-4);x.beginPath();x.moveTo(a,b-h);x.lineTo(a+w,b);x.moveTo(a+w,b-h);x.lineTo(a,b);x.stroke()}
 else if(o.t==='barrier'){for(let i=0;i<4;i++){x.fillStyle=i%2?'#fff':'#e63946';x.fillRect(a,b-h+i*h/4,w,h/4)}x.fillStyle='#333';x.fillRect(a-4,b-h-5,w+8,6)}
 else if(o.t==='enemy'){const j=Math.abs(Math.sin(t/120))*5;x.fillStyle='#9d4edd';x.beginPath();x.arc(a+w/2,b-h/2-j,w/2,Math.PI,0);x.lineTo(a+w,b-j);x.lineTo(a,b-j);x.fill();x.fillStyle='#fff';x.fillRect(a+7,b-h/2-6-j,9,9);x.fillRect(a+21,b-h/2-6-j,9,9);x.fillStyle='#111';x.fillRect(a+9,b-h/2-j-2,4,5);x.fillRect(a+23,b-h/2-j-2,4,5)}
 else{x.fillStyle='#4a4e69';x.fillRect(a,b-h,w,h);x.fillStyle='#6b7090';x.fillRect(a+6,b-h+8,w-12,10);x.fillRect(a+6,b-h+30,w-12,10);x.fillStyle='#e63946';for(let i=0;i<3;i++){x.beginPath();x.moveTo(a+i*w/3,b-h);x.lineTo(a+w/6+i*w/3,b-h-12);x.lineTo(a+(i+1)*w/3,b-h);x.fill()}}}
function limb(g,sx,sy,l1,a1,l2,a2,w,c1,c2){const mx=sx+l1*Math.sin(a1),my=sy+l1*Math.cos(a1),ex=mx+l2*Math.sin(a2),ey=my+l2*Math.cos(a2);
 g.lineCap='round';g.lineJoin='round';g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=w+2.5;g.beginPath();g.moveTo(sx,sy);g.lineTo(mx,my);g.lineTo(ex,ey);g.stroke();
 g.lineWidth=w;g.strokeStyle=c1;g.beginPath();g.moveTo(sx,sy);g.lineTo(mx,my);g.stroke();g.strokeStyle=c2;g.beginPath();g.moveTo(mx,my);g.lineTo(ex,ey);g.stroke();return[ex,ey,a2]}
const fk=(a,k)=>[21*Math.sin(a)+21*Math.sin(a-k),21*Math.cos(a)+21*Math.cos(a-k)];
function pose(s,ph,t){const a=Math.sin(ph),c=Math.cos(ph);
 if(s==='run')return{lean:.14,hd:Math.sin(ph*2)*.04,L:[[a*.95,Math.max(0,c)*1.3],[-a*.95,Math.max(0,-c)*1.3]],A:[[-a*1.1,1.2],[a*1.1,1.2]]};
 if(s==='jump')return{lean:.06,hd:-.05,L:[[.8,1.2],[-.5,.7]],A:[[2.5,.2],[-1.3,.3]]};
 if(s==='fall')return{lean:-.05,hd:.05,L:[[.35,.3],[-.25,.2]],A:[[1.6,.1],[-1.6,.1]]};
 if(s==='hit')return{lean:-.25,hd:-.25,L:[[.5,.6],[-.7,.3]],A:[[2.8,.2],[-2.6,.2]]};
 return{lean:0,hd:Math.sin(t/500)*.03,L:[[.08,0],[-.08,0]],A:[[.1,.25+Math.sin(t/400)*.1],[-.1,.25]]}}
function drawChar(g,i,s,ph,t){const c=CH[i],P=pose(s,ph,t),gr=s==='run'||s==='idle';
 const hy=gr?-Math.max(fk(...P.L[0])[1],fk(...P.L[1])[1]):-40;g.save();
 const leg=(j,hx)=>{const th=P.L[j][0],r=limb(g,hx,hy,21,th,21,th-P.L[j][1],10,c.pa,c.pa);g.save();g.translate(r[0],r[1]);g.rotate(-r[2]*.4);g.fillStyle=c.sh;g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;g.beginPath();g.roundRect(-5,-6,17,9,4);g.fill();g.stroke();g.restore()};
 leg(1,-4);leg(0,5);
 g.translate(0,hy);g.rotate(P.lean);
 const arm=(j,sx)=>{const th=P.A[j][0],r=limb(g,sx,-30,15,th,14,th+P.A[j][1],7,c.tp,c.fo);g.fillStyle=c.sk;g.beginPath();g.arc(r[0],r[1],4.5,0,7);g.fill()};
 arm(1,-6);
 g.fillStyle=c.pa;g.beginPath();g.roundRect(-13,-8,26,12,4);g.fill();
 g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;g.fillStyle=c.tp;g.beginPath();g.roundRect(-14,-34,28,30,9);g.fill();g.stroke();
 if(c.st){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;for(let k=-10;k<=10;k+=5){g.beginPath();g.moveTo(k,-30);g.lineTo(k,-6);g.stroke()}}
 if(c.pk){g.strokeStyle='rgba(0,0,0,.25)';g.strokeRect(3,-26,8,9)}
 if(c.bz){g.fillStyle='#d9c9a3';g.beginPath();g.moveTo(-6,-34);g.lineTo(6,-34);g.lineTo(0,-16);g.fill();g.strokeStyle='rgba(255,255,255,.25)';g.beginPath();g.moveTo(-6,-34);g.lineTo(0,-16);g.lineTo(6,-34);g.stroke()}
 g.fillStyle=c.sk;g.fillRect(-5,-40,10,8);
 g.save();g.translate(0,-57);g.rotate(P.hd);const hp=()=>{g.beginPath();g.roundRect(-16,-20,32,40,15)};
 hp();g.save();g.clip();const im=IM[i];if(im.complete&&im.naturalWidth)g.drawImage(im,-16,-20,32,40);else{g.fillStyle=c.sk;g.fill()}g.restore();
 g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;hp();g.stroke();
 if(s==='hit'){g.fillStyle='#ffe066';for(let k=0;k<3;k++){const q=t/150+k*2.1;g.beginPath();g.arc(Math.cos(q)*20,-24+Math.sin(q)*5,3,0,7);g.fill()}}
 g.restore();arm(0,6);g.restore()}
function drawP(t){if(inv>0&&Math.floor(t/80)%2)return;const s=st==='over'?'hit':!p.g?(p.vy<0?'jump':'fall'):'run',cx=p.x+28,dd=p.dd||0;
 x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.ellipse(cx,G+3,Math.max(8,24-(G-p.y)/9),6,0,0,7);x.fill();
 x.save();x.translate(cx,p.y);if(s==='hit'){x.translate(0,-Math.sin(Math.min(dd,16)/16*Math.PI)*26);x.rotate(-Math.min(1.45,dd*.07))}
 drawChar(x,sel,s,dist/18,t);x.restore();
 if(shield){x.strokeStyle='rgba(76,201,240,.9)';x.lineWidth=4;x.beginPath();x.arc(cx,p.y-60,72,0,7);x.stroke()}
 if(magnet>0){x.strokeStyle='rgba(255,122,217,.4)';x.lineWidth=2;x.beginPath();x.arc(cx,p.y-60,85+Math.sin(t/100)*4,0,7);x.stroke()}}
function anim(t){CV.forEach((k,i)=>{const g=k.getContext('2d');g.clearRect(0,0,120,170);g.save();g.translate(60,162);g.scale(1.25,1.25);drawChar(g,i,i===sel?'run':'idle',t/110,t);g.restore()})}
/* hud */
let lv={};function hud(){const s=score(),m=Math.floor(dist/10);if(lv.s!==s){lv.s=s;$('sv').textContent=s}if(lv.m!==m){lv.m=m;$('ds').textContent=m+' m'}if(lv.c!==cn){lv.c=cn;$('cn').textContent='🪙 '+cn}}
function loop(t){const dt=Math.min((t-last)/16.67,2.5)||1;last=t;if(st==='play'){update(dt);hud()}else if(st==='over'){p.dd+=dt;for(const q of pts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.25*dt;q.l-=dt}pts=pts.filter(q=>q.l>0);shk*=.9}draw(t);if(st==='menu')anim(t);requestAnimationFrame(loop)}
/* flow */
function start(){reset();lv={};st='play';['menu','pz','ov'].forEach(i=>$(i).hidden=true);$('hud').hidden=false;$('jb').hidden=false;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function menu(){st='menu';['pz','ov','hud','jb'].forEach(i=>$(i).hidden=true);$('menu').hidden=false;$('bm').textContent=best}
function pause(){if(st==='play'){st='pause';$('pz').hidden=false}else if(st==='pause'){st='play';$('pz').hidden=true}}
function cards(){const c=$('cards');c.innerHTML='';CV=[];CH.forEach((h,i)=>{const d=document.createElement('div');d.className='cd'+(i===sel?' on':'');const k=document.createElement('canvas');k.width=120;k.height=170;d.appendChild(k);d.insertAdjacentHTML('beforeend','<b>'+h.n+'</b><i>'+h.d+'</i>');d.onclick=()=>{sel=i;cards()};c.appendChild(d);CV.push(k)});anim(performance.now())}
$('go').onclick=start;$('ag').onclick=start;$('rsm').onclick=pause;$('pb').onclick=pause;$('mn1').onclick=menu;$('mn2').onclick=menu;
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};
const jb=$('jb');jb.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.addEventListener('touchmove',e=>{if(st==='play')e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.code;if(['Space','ArrowUp','KeyW'].includes(k)){e.preventDefault();if(e.repeat)return;if(st==='play')jump();else if(st==='menu'||st==='over')start()}
 else if(k==='KeyP'||k==='Escape')pause();else if(k==='KeyM')$('mu').click();
 else if(st==='menu'&&k==='ArrowRight'){sel=(sel+1)%CH.length;cards()}else if(st==='menu'&&k==='ArrowLeft'){sel=(sel+CH.length-1)%CH.length;cards()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')pause()});
$('gl').textContent=goal;cards();menu();reset();st='menu';requestAnimationFrame(loop);
</script></body></html>
